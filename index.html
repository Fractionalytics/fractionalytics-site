  og-image.png link-preview card carries the same tagline (content/og-image.html is its source).
  Brand fonts via Google Fonts CDN (SIL OFL); logo is a self-contained vector. Deploy index.html
  alongside logo-stack.svg and og-image.png.

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fractionalytics: AI strategy, the data beneath it, and the systems to run it</title>
  <meta name="description" content="Fractionalytics: AI strategy, the data beneath it, and the systems to run it. David Smith, Miami.">

  <!-- Social sharing (Open Graph + Twitter) -->

  <meta property="og:title" content="Fractionalytics: AI strategy, the data beneath it, and the systems to run it">
  <meta property="og:description" content="One person who sets the AI strategy with your leaders, builds the data and systems to run it, and ships the highest-leverage pieces. Past the pilot, where the bigger ideas need more and better data than any pilot ever touched. David Smith, Miami.">
  <meta property="og:image" content="https://fractionalytics.io/og-image-2026-07.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fractionalytics.io/og-image-2026-07.png">

  <!-- 1/F mark as favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231A658F'/%3E%3Ctext x='50' y='72' font-family='Arial Narrow,sans-serif' font-weight='700' font-size='58' fill='%2341B6E6' text-anchor='middle'%3E1/F%3C/text%3E%3C/svg%3E">

  <!-- Brand faces (Google Fonts, SIL OFL): Oswald = display; Archivo = body; JetBrains Mono = labels -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Archivo:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-blue: #1A658F;
      --brand-cyan: #41B6E6;
      --blue-600:   #155578;
      --blue-700:   #114561;
      --blue-900:   #0A2838;
      --paper-0:    #FAF9F7;
      --paper-100:  #E4E2DD;
      --paper-600:  #565350;
      --paper-400:  #97928A;
      --border:     #D4D1C9;

      --font-display: 'Oswald', 'Arial Narrow', sans-serif;
      --font-body:    'Archivo', system-ui, -apple-system, sans-serif;
      --font-mono:    'JetBrains Mono', ui-monospace, monospace;

      --ring: color-mix(in srgb, var(--brand-cyan) 55%, transparent);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--paper-100);
      color: var(--blue-900);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      min-height: 100svh;
    }

    main {
      width: 100%;
      max-width: 640px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: clamp(216px, 46vw, 324px);
      height: auto;
      margin-bottom: 32px;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: clamp(0.7rem, 1.7vw, 0.78rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brand-blue);
    }

    .tagline {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(1.02rem, 2.5vw, 1.3rem);
      line-height: 1.28;
      letter-spacing: 0.005em;
      color: var(--brand-blue);
      margin-top: 12px;
      max-width: min(30ch, 100%);
    }

    .rule {
      width: 64px;
      height: 1px;
      background: var(--border);
      margin: 38px 0 28px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .contact a {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--blue-600);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding: 2px 0;
      transition: color 160ms ease-out, border-color 160ms ease-out;
    }
    .contact a:hover { color: var(--brand-cyan); border-color: var(--brand-cyan); }
    .contact a:focus-visible { outline: 3px solid var(--ring); outline-offset: 4px; border-radius: 2px; }
    .contact .dot { color: var(--paper-400); font-family: var(--font-mono); }

    .by {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--paper-400);
      margin-top: 30px;
    }

    @media (max-width: 480px) {
      .contact .dot { display: none; }
      .contact { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo-stack.svg" alt="Fractionalytics" width="327" height="102">

    <p class="eyebrow">Past the pilot</p>
    <p class="tagline">AI strategy, the data beneath it, and the systems to run it</p>

    <div class="rule" aria-hidden="true"></div>

    <nav class="contact" aria-label="Contact">
      <a href="mailto:david@fractionalytics.io">david@fractionalytics.io</a>
      <span class="dot" aria-hidden="true">·</span>
      <a href="https://www.linkedin.com/in/dksmith01/" target="_blank" rel="noopener">LinkedIn</a>
    </nav>

    <p class="by">David Smith</p>
  </main>
</body>
</html>
